<style>
/* taste-skill: DESIGN_VARIANCE=5, MOTION_INTENSITY=4, VISUAL_DENSITY=5
   Dual theme system — Light / Dark */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* Light Theme - default when no data-theme set */
[data-theme="light"], :root{
  --r-sm:8px;--r-md:14px;--r-lg:20px;--dur:.2s;--ease:cubic-bezier(.4,0,.2,1);--header-h:56px;
  --bg:#eef1fb;--surface:rgba(255,255,255,.62);--surface-soft:rgba(255,255,255,.45);--surface-hover:rgba(255,255,255,.8);
  --accent:#5b7cfa;--accent-light:rgba(91,124,250,.14);--accent-hover:#4365e8;
  --success:#10b981;--success-bg:rgba(16,185,129,.15);--warning:#f59e0b;--warning-bg:rgba(245,158,11,.15);
  --danger:#ef4444;--danger-bg:rgba(239,68,68,.14);--info:#3b82f6;--info-bg:rgba(59,130,246,.14);
  --fg:#23233a;--fg-2nd:#555a70;--fg-3rd:#8b90a3;--fg-4th:#b0b4c4;
  --bd:rgba(255,255,255,.6);--bd-2:rgba(160,170,220,.35);
  --sh-sm:0 1px 3px rgba(30,40,80,.06);--sh:0 4px 14px rgba(30,40,80,.07),0 1px 2px rgba(30,40,80,.04);
  --sh-md:0 8px 28px rgba(30,40,80,.09);--sh-lg:0 20px 60px rgba(30,40,80,.14);
  --side-bg:rgba(255,255,255,.5);
  --side-text:#23233a;--side-input-bg:rgba(255,255,255,.5);--side-input-bd:rgba(160,170,220,.25);
  --side-label:rgba(70,80,120,.45);
  --chip-bg:rgba(91,124,250,.14);--chip-text:#5b7cfa;--chip-del:rgba(91,124,250,.35);
  --modal-overlay:rgba(30,40,80,.25);--scrollbar-thumb:rgba(160,170,220,.5);
  --img-checked-bd:#5b7cfa;--img-checked-bg:rgba(91,124,250,.1);
  --glass-blur:blur(20px) saturate(160%);
}

[data-theme="dark"]{
  --r-sm:8px;--r-md:14px;--r-lg:20px;--dur:.2s;--ease:cubic-bezier(.4,0,.2,1);--header-h:56px;
  --bg:#0f1220;--surface:rgba(30,34,54,.6);--surface-soft:rgba(255,255,255,.05);--surface-hover:rgba(255,255,255,.09);
  --accent:#6b96ff;--accent-light:rgba(107,150,255,.16);--accent-hover:#8aadff;
  --success:#34d399;--success-bg:rgba(52,211,153,.16);--warning:#fbbf24;--warning-bg:rgba(251,191,36,.16);
  --danger:#f87171;--danger-bg:rgba(248,113,113,.16);--info:#60a5fa;--info-bg:rgba(96,165,250,.16);
  --fg:#eef0f8;--fg-2nd:#b3b9cc;--fg-3rd:#7a8098;--fg-4th:#545a70;
  --bd:rgba(255,255,255,.09);--bd-2:rgba(255,255,255,.16);
  --sh-sm:0 1px 3px rgba(0,0,0,.3);--sh:0 4px 14px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
  --sh-md:0 8px 28px rgba(0,0,0,.45);--sh-lg:0 20px 60px rgba(0,0,0,.55);
  --side-bg:rgba(22,25,40,.55);
  --side-text:#eef0f8;--side-input-bg:rgba(255,255,255,.06);--side-input-bd:rgba(255,255,255,.1);
  --side-label:rgba(255,255,255,.4);
  --chip-bg:rgba(107,150,255,.18);--chip-text:#6b96ff;--chip-del:rgba(107,150,255,.35);
  --modal-overlay:rgba(0,0,0,.6);--scrollbar-thumb:rgba(255,255,255,.18);
  --img-checked-bd:#6b96ff;--img-checked-bg:rgba(107,150,255,.14);
  --glass-blur:blur(20px) saturate(140%);
}

/* Theme transitions */
html{transition:color-scheme .3s ease}
body{transition:background-color .3s ease,color .3s ease}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* Base */
html,body{height:100%}
body{transition:background-color .3s ease,color .3s ease}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans SC,sans-serif;font-size:13.5px;line-height:1.55;background:var(--bg);color:var(--fg);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(1100px 700px at 8% -5%, rgba(120,150,255,.16), transparent 60%),
  radial-gradient(900px 650px at 108% 10%, rgba(255,170,210,.18), transparent 55%),
  radial-gradient(1000px 800px at 50% 120%, rgba(120,240,220,.14), transparent 60%),
  var(--bg);}
[data-theme="dark"] body{background:
  radial-gradient(1100px 700px at 8% -5%, rgba(90,120,255,.22), transparent 60%),
  radial-gradient(900px 650px at 108% 10%, rgba(200,110,190,.18), transparent 55%),
  radial-gradient(1000px 800px at 50% 120%, rgba(60,190,180,.14), transparent 60%),
  var(--bg);}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:transparent;width:100%}
::selection{background:var(--accent);color:#fff}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
.hidden{display:none!important}

/* Layout */
.app{display:flex;width:100%;height:100dvh}
.side{flex:0 0 360px;display:flex;flex-direction:column;background:var(--side-bg);color:var(--side-text);position:relative;z-index:10;border-right:1px solid var(--bd);overflow:hidden;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.side-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--side-input-bd);flex-shrink:0}
.side-head .logo-wrap{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#5b7cfa,#8a6bfa);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;box-shadow:0 2px 12px rgba(91,124,250,.35);transition:transform .2s ease,box-shadow .2s ease}.side-head .logo-wrap:hover{transform:scale(1.1);box-shadow:0 4px 20px rgba(91,124,250,.5)}
.side-head .logo-text{font-size:14px;font-weight:600;flex:1;letter-spacing:-.02em;text-wrap:balance}
.side-head .conn-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;background:var(--success-bg);color:var(--success)}
.side-head .conn-badge.disconnected{background:var(--danger-bg);color:var(--danger)}
.side-scroll{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.side-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--side-label);margin-bottom:8px;padding:0 4px;display:flex;align-items:center;gap:6px}
.side-section-title .badge-count{font-size:9px;padding:1px 6px;border-radius:8px;background:var(--side-input-bg);color:var(--fg-3rd);font-weight:600}
.side-footer{flex-shrink:0;padding:10px 16px;border-top:1px solid var(--side-input-bd);display:flex;align-items:center;gap:8px;font-size:11px}

/* Advanced settings collapsible */
.adv-toggle{cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:4px;transition:all var(--dur) var(--ease);font-size:10.5px;font-weight:600;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em;margin-top:14px;width:100%;border:none;background:none}
.adv-toggle:hover{background:var(--surface-hover);color:var(--fg)}
.adv-toggle .arrow{transition:transform .2s ease;font-size:8px;margin-left:auto}
.adv-toggle.open .arrow{transform:rotate(90deg)}
.adv-section{overflow:hidden;max-height:0;transition:max-height .3s ease;display:flex;flex-direction:column;gap:8px}
.adv-section.open{max-height:2000px}
.adv-field-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2nd);padding:2px 0}
.adv-field-row label{flex-shrink:0;font-size:10.5px;font-weight:500;color:var(--side-label);min-width:56px}
.adv-field-row .side-form-input{flex:1}
.adv-group-title{font-size:10px;font-weight:600;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em;padding:4px 0 2px;border-bottom:1px solid var(--side-input-bd)}

/* Account tabs */
.account-tab{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;font-size:11.5px;font-weight:500;border-radius:20px;background:var(--side-input-bg);color:var(--fg-2nd);border:1px solid var(--side-input-bd);transition:all var(--dur) var(--ease);cursor:pointer;margin-right:4px;margin-bottom:4px}
.account-tab:hover{background:var(--surface-hover);color:var(--fg);box-shadow:var(--sh-sm)}
.account-tab.active{background:rgba(91,124,250,.15);color:#5b7cfa;border-color:rgba(91,124,250,.32);box-shadow:0 2px 8px rgba(91,124,250,.15)}
.account-tab .badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:8px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-weight:600;margin-left:4px}
.account-tab.active .badge{background:rgba(91,124,250,.25);color:#5b7cfa}
.account-tab .acc-status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.account-tab .acc-status-dot.idle{background:var(--fg-4th)}
.account-tab .acc-status-dot.running{background:var(--success);animation:pulse 1.5s ease-in-out infinite}
.account-tab .acc-status-dot.needs_login{background:var(--warning)}

/* Forms */
.side-form-group{display:flex;flex-direction:column;gap:4px}
.side-form-label{font-size:10.5px;font-weight:500;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em}
.side-form-input,.side-form-select{font-size:12px;padding:7px 10px;border-radius:8px;background:var(--side-input-bg);border:1px solid var(--side-input-bd);color:var(--fg);transition:all var(--dur) var(--ease)}
.side-form-input:focus,.side-form-select:focus{border-color:rgba(91,124,250,.55);box-shadow:0 0 0 3px rgba(91,124,250,.15)}
.side-form-input::placeholder{color:var(--fg-4th)}
.side-form-select option{background:var(--surface);color:var(--fg)}
.acc-field-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2nd)}
.acc-field-row label{flex-shrink:0;font-size:10.5px;font-weight:500;color:var(--side-label);text-transform:uppercase;letter-spacing:.04em;min-width:48px}

/* File upload */
.file-input-wrap{display:flex;flex:1;gap:4px}
.file-input-wrap .side-form-input{flex:1}
.file-btn{flex-shrink:0;padding:6px 10px;font-size:10.5px;font-weight:500;border-radius:4px;background:rgba(91,124,250,.2);color:#5b7cfa;border:1px solid rgba(91,124,250,.25);transition:all var(--dur) var(--ease);white-space:nowrap}
.file-btn:hover{background:rgba(91,124,250,.32)}

/* Toggle switch */
.toggle-switch{position:relative;display:inline-block;width:36px;height:20px;border-radius:10px;background:var(--bd-2);cursor:pointer;transition:all var(--dur) var(--ease);flex-shrink:0}
.toggle-switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.toggle-switch.on{background:var(--accent)}
.toggle-switch.on::after{left:18px;background:#fff;box-shadow:0 2px 6px rgba(91,124,250,.35)}

/* Buttons */
.side-btn-row{display:flex;gap:6px;align-items:center}
.side-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 12px;font-size:11px;font-weight:500;border-radius:4px;transition:all var(--dur) var(--ease);white-space:nowrap}
.side-btn-ghost{background:var(--side-input-bg);color:var(--fg-2nd);border:1px solid var(--side-input-bd);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.side-btn-ghost:hover{background:var(--surface-hover);color:var(--fg);box-shadow:var(--sh)}
.side-btn-sm{padding:4px 8px;font-size:10px}
.side-btn-danger{color:var(--danger)!important}
.side-btn-block{width:100%}

/* Image multi-select grid */
.image-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:200px;overflow-y:auto;padding:2px}
.image-grid-item{position:relative;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all var(--dur) var(--ease);aspect-ratio:16/10}
.image-grid-item img{width:100%;height:100%;object-fit:cover;display:block;border-radius:3px}
.image-grid-item .check-overlay{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;transition:all var(--dur) var(--ease);opacity:0}
.image-grid-item.checked{border-color:var(--img-checked-bd);background:var(--img-checked-bg)}
.image-grid-item.checked .check-overlay{opacity:1;background:var(--accent)}
.image-grid-item:hover .check-overlay{opacity:1}
.image-grid-item .img-name{position:absolute;bottom:0;left:0;right:0;padding:3px 6px;font-size:8px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.image-grid-item .img-del-btn{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:rgba(220,38,38,.8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s ease;z-index:2;line-height:1}
.image-grid-item:hover .img-del-btn{opacity:1}
.image-grid-item .img-del-btn:hover{background:#dc2626;transform:scale(1.15)}

/* Chips */
.chip-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;min-height:22px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;font-size:10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);max-width:100%;transition:all var(--dur) var(--ease);animation:chipIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes chipIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.chip .chip-remove{cursor:pointer;font-size:12px;line-height:1;opacity:.6;transition:opacity var(--dur) var(--ease);margin-left:2px;color:var(--chip-del)}
.chip .chip-remove:hover{opacity:1}

/* Sidebar job list */
.sbar-job-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:4px;background:var(--side-input-bg);border:1px solid var(--side-input-bd);cursor:pointer;transition:all var(--dur) var(--ease);margin-bottom:4px}
.sbar-job-item:hover{background:var(--surface-hover)}
.sbar-job-query{font-size:11px;font-weight:500;color:var(--fg)}
.sbar-job-city{font-size:9px;color:var(--fg-3rd);padding:2px 6px;border-radius:3px;background:var(--side-input-bg)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.idle{background:var(--fg-4th)}
.status-dot.running{background:#34d399;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,.4)}50%{opacity:.7;box-shadow:0 0 0 4px rgba(52,211,153,0)}}
.status-text{font-size:11px;font-weight:500;color:var(--fg-3rd)}
.status-label{font-size:10px;color:var(--fg-4th);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{display:flex;align-items:center;padding:0 24px;height:var(--header-h);border-bottom:1px solid var(--bd);background:var(--surface);flex-shrink:0;gap:12px;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-.02em}
.topbar-title .highlight{color:var(--accent)}
.topbar-task{font-size:11px;color:var(--fg-3rd);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.topbar-badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--accent-light);color:var(--accent);letter-spacing:.02em}

/* Theme toggle button */
.theme-toggle{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;background:var(--surface-soft);border:1px solid var(--bd);transition:all var(--dur) var(--ease);font-size:11px;font-weight:500;color:var(--fg-2nd);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.theme-toggle:hover{background:var(--surface-hover);color:var(--fg);box-shadow:var(--sh);transform:translateY(-1px)}
.theme-toggle .toggle-icon{font-size:14px;line-height:1}

/* Content */
.content{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;text-wrap:pretty}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--bd);box-shadow:var(--sh-sm);transition:all var(--dur) var(--ease);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.stat-card:hover{box-shadow:var(--sh-md);border-color:var(--bd-2);transform:translateY(-2px)}
.stat-card.accent{border-left:3px solid var(--accent)}
.stat-card.success{border-left:3px solid var(--success)}
.stat-card.warning{border-left:3px solid var(--warning)}
.stat-card.info{border-left:3px solid var(--info)}
.stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3rd)}
.stat-value{font-size:28px;font-weight:700;margin:4px 0;letter-spacing:-.03em;color:var(--fg)}
.stat-sub{font-size:11px;color:var(--fg-3rd)}

/* Button variants */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;font-size:12px;font-weight:500;border-radius:10px;transition:all var(--dur) var(--ease);white-space:nowrap}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-success{background:var(--success);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.25)}
.btn-success:hover{filter:brightness(1.05);4);box-shadow:0 6px 18px rgba(16,185,129,.35);transform:translateY(-1px)}
.btn-success:active{transform:translateY(0)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.22)}
.btn-danger:hover{filter:brightness(1.05);box-shadow:0 6px 18px rgba(239,68,68,.32);transform:translateY(-1px)}
.btn-danger:active{transform:translateY(0)}
.btn-ghost{background:var(--surface-soft);color:var(--fg-2nd);border:1px solid var(--bd);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.btn-ghost:hover{background:var(--surface-hover);color:var(--fg);box-shadow:var(--sh);transform:translateY(-1px)}
.btn-warn{background:var(--warning);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.22)}
.btn-warn:hover{filter:brightness(1.05);box-shadow:0 6px 18px rgba(245,158,11,.32);transform:translateY(-1px)}

/* Panels */
.panel-row{display:flex;gap:16px;flex:1;min-height:0}
.panel{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh-sm);overflow:hidden;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.panel-half{flex:1}
.panel-header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);flex-shrink:0;gap:6px}
.panel-icon{font-size:14px}
.panel-title{font-size:12px;font-weight:600;color:var(--fg);letter-spacing:-.01em}
.panel-actions{margin-left:auto;display:flex;gap:4px}
.panel-body{flex:1;overflow-y:auto;padding:8px 12px}

/* Job list */
.job-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface-soft);margin-bottom:6px;transition:all var(--dur) var(--ease);cursor:pointer}
.job-item:hover{background:var(--surface-hover);border-color:var(--bd-2);box-shadow:var(--sh);transform:translateY(-1px)}
.job-item .job-info{flex:1;min-width:0}
.job-item .job-query{font-size:13px;font-weight:500;color:var(--fg)}
.job-item .job-city{font-size:10px;color:var(--fg-3rd);margin-top:1px}
.job-thumbs{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.job-thumbs img{width:40px;height:30px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);cursor:pointer;transition:transform var(--dur) var(--ease)}
.job-thumbs img:hover{transform:scale(1.15)}
.job-thumbs-more{font-size:10px;color:var(--fg-3rd);align-self:center;margin-left:2px}
.job-img-chip{position:relative;display:inline-block;width:64px;height:48px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);cursor:zoom-in;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.job-img-chip:hover{transform:scale(1.08);box-shadow:var(--sh)}
.job-img-chip img{width:100%;height:100%;object-fit:cover}
.job-img-chip .chip-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur) var(--ease);line-height:1}
.job-img-chip:hover .chip-remove{opacity:1}
.job-item .job-badge{font-size:9px;padding:2px 6px;border-radius:3px;background:var(--accent-light);color:var(--accent);font-weight:500}
.job-item .job-del{font-size:14px;color:var(--fg-4th);cursor:pointer;padding:2px 4px;border-radius:3px;transition:all var(--dur) var(--ease)}
.job-item .job-del:hover{color:var(--danger);background:var(--danger-bg)}
.job-item .job-toggle{flex-shrink:0}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:8px}
.empty-icon{font-size:32px;opacity:.5}
.empty-title{font-size:14px;font-weight:600;color:var(--fg-2nd)}
.empty-desc{font-size:11px;color:var(--fg-3rd)}

/* Modal large variant */
.modal-large{max-width:800px;width:90%}
.modal-large textarea{width:100%;padding:8px 12px;font-size:12px;border:1px solid var(--bd-2);border-radius:8px;background:var(--side-input-bg);color:var(--fg);resize:vertical;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.modal-large textarea:focus{outline:none;border-color:var(--accent)}

/* Excel file list */
.ex0.excel-file-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--bd-2);border-radius:8px;margin-bottom:8px}
.excel-file-info{flex:1;min-width:0}
.excel-file-name{font-size:12px;font-weight:600;color:var(--fg)}
.excel-file-meta{font-size:10px;color:var(--fg-3rd);margin-top:2px}

/* Log */
.log-area{font-family:ui-monospace,SF Mono,Menlo,Consolas,monospace;font-size:11px;line-height:1.6;padding:8px 12px}
.log-entry{padding:2px 0;display:flex;gap:8px;word-break:break-all}
.log-time{color:var(--fg-4th);flex-shrink:0;font-size:10px}
.log-message{flex:1}
.log-SYSTEM,.log-INFO{color:var(--fg-2nd)}
.log-SUCCESS{color:var(--success)}
.log-ERROR{color:var(--danger)}
.log-WARN{color:var(--warning)}
.log-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:8px;color:var(--fg-3rd)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal{background:var(--surface);border-radius:20px;padding:24px;width:520px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:var(--sh-lg);border:1px solid var(--bd);animation:slideUp .2s ease;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--fg)}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:11px;font-weight:500;color:var(--fg-2nd);margin-bottom:4px}
.modal-field input,.modal-field textarea,.modal-field select{width:100%;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface-soft);font-size:12px;color:var(--fg);transition:all var(--dur) var(--ease)}
.modal-field input:focus,.modal-field textarea:focus,.modal-field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.modal-field textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(91,124,250,.25);position:relative;overflow:hidden}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 6px 20px rgba(91,124,250,.35);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s ease}
.btn-primary:hover::after{transform:translateX(40%)}
.btn-cancel{background:var(--surface-soft);color:var(--fg-2nd);border:1px solid var(--bd)}
.btn-cancel:hover{background:var(--surface-hover);color:var(--fg)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.panel-row{flex-direction:column}}
@media(max-width:600px){.side{display:none}.stats-grid{grid-template-columns:1fr}.content{padding:12px}}

/* Login Modal */
.login-modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);z-index:9999;display:none;align-items:center;justify-content:center;animation:fadeIn .25s ease;-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%)}
.login-modal-overlay.active{display:flex}
.login-modal{position:relative;background:var(--surface);border-radius:24px;padding:0;max-width:440px;width:90%;box-shadow:0 24px 64px rgba(0,0,0,.28),0 0 0 1px var(--bd);border:1px solid var(--bd);animation:modalPop .28s cubic-bezier(.2,.9,.3,1.2);overflow:hidden;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.login-modal-header{background:linear-gradient(135deg,var(--accent),#7c5bfa);padding:28px 32px 24px;text-align:center;position:relative}
.login-modal-header::after{content:"";position:absolute;bottom:-12px;left:0;right:0;height:24px;background:var(--surface);border-radius:18px 18px 0 0}
.login-modal-icon{font-size:42px;line-height:1;margin-bottom:10px;display:inline-block;animation:iconBob 2.2s ease-in-out infinite;filter:drop-shadow(0 2px 8px rgba(0,0,0,.2))}
.login-modal-title{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.01em;text-shadow:0 1px 3px rgba(0,0,0,.15)}
.login-modal-body{padding:20px 32px 28px;text-align:center}
.login-modal-desc{font-size:13px;color:var(--fg-2nd);margin-bottom:24px;line-height:1.7}
.login-modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.login-modal-btn{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;background:var(--accent);color:#fff;transition:all var(--dur) var(--ease);box-shadow:0 2px 8px rgba(30,75,210,.25)}
.login-modal-btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 6px 18px rgba(30,75,210,.35)}
.login-modal-btn:active{transform:translateY(0)}
.login-modal-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.login-modal-btn-secondary{background:var(--surface-soft);color:var(--fg-2nd);border:1px solid var(--bd);box-shadow:none}
.login-modal-btn-secondary:hover{background:var(--surface-hover);color:var(--fg);%2c0 2px 6px rgba(0,0,0,.06)}
@keyframes modalPop{0%{transform:scale(.92) translateY(8px);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes iconBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="side-head">
      <div class="logo-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg></div>
      <div class="logo-text">Boss直聘</div>
      <span class="conn-badge" id="connStatus">已连接</span>
    </div>
    <div class="side-scroll" id="sideScroll">
      <div>
        <div class="side-section-title">账号 <span class="badge-count" id="accBadge">1</span></div>
        <div id="accountTabs" style="margin-bottom:6px"></div>
        <div class="side-btn-row">
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="addAccount()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 添加</button>
          <button class="side-btn side-btn-ghost side-btn-sm side-btn-danger" onclick="deleteAccount()" title="删除当前账号">删除</button>
        </div>
      </div>
      <div>
        <div class="side-section-title">账号设置</div>
        <div class="acc-field-row"><label>名称</label><input class="side-form-input" id="accName" type="text" placeholder="主账号" onchange="onAccChange()"></div>
        <div class="acc-field-row"><label>Cookie</label>
          <div class="file-input-wrap">
            <input class="side-form-input" id="accCookie" type="text" placeholder="zhipin_cookies.json" onchange="onAccChange()">
            <button class="file-btn" onclick="document.getElementById('cookieFileInput').click()" title="上传 Cookie 文件">📁</button>
            <input type="file" id="cookieFileInput" class="hidden" accept=".json,.txt" onchange="uploadCookieFile(event)">
          </div>
        </div>
        <div class="acc-field-row" style="gap:6px"><label>启用</label><span id="accEnabled" class="toggle-switch on" onclick="toggleAccEnabled()"></span></div>
      </div>
      <div>
        <div class="side-section-title">🤖 AI 智能解析 <span class="badge-count" id="aiBadge">关</span></div>
        <div class="acc-field-row"><label>启用</label><span id="aiEnabled" class="toggle-switch" onclick="toggleAiEnabled()"></span></div>
        <div class="acc-field-row"><label>匹配阈值</label><input class="side-form-input" id="aiThreshold" type="number" min="0" max="100" placeholder="70" onchange="onAiChange()"></div>
        <button class="adv-toggle" id="aiProvToggle" onclick="toggleAiProviders()">
          🔌 AI 接口列表 <span class="arrow">▶</span>
          <span id="aiProvSummary" style="margin-left:4px;font-size:10px;color:var(--fg-3rd);font-weight:400"></span>
        </button>
        <div class="adv-section" id="aiProvSection">
          <div id="aiProviders" style="margin-top:8px"></div>
        </div>
        <div class="side-btn-row" style="margin-top:6px;flex-wrap:wrap">
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="addAiProvider()">➕ 添加 AI 接口</button>
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="showResumeModal()">📄 编辑简历</button>
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="showPromptModal()">✏️ 编辑提示词</button>
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="testAi()">⚡ 测试 AI</button>
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="showRulesModal()">📋 编辑规则</button>
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="showTemplatesModal()">💬 编辑模板</button>
          <button class="side-btn side-btn-ghost side-btn-sm" onclick="showEvolutionModal()">🧬 自进化</button>
        </div>
        <div id="aiStatus" style="font-size:10px;color:var(--fg-3rd);margin-top:4px;word-break:break-all"></div>
        <!-- AI 测试对比面板 -->
        <div class="ai-test-panel" style="margin-top:10px;border:1px solid var(--bd-2);border-radius:8px;padding:10px">
          <div style="font-size:11px;font-weight:600;color:var(--fg-2nd);margin-bottom:6px">🧪 AI 测试对比</div>
          <textarea id="aiTestJobDesc" placeholder="粘贴岗位描述（JD）进行测试..." style="width:100%;min-height:60px;padding:6px 8px;font-size:11px;border:1px solid var(--bd-2);border-radius:6px;background:var(--side-input-bg);color:var(--fg);resize:vertical;box-sizing:border-box;margin-bottom:6px"></textarea>
          <div class="side-btn-row" style="margin-bottom:6px;flex-wrap:wrap">
            <button class="side-btn side-btn-ghost side-btn-sm" onclick="runAiTest()">▶ 运行测试</button>
            <button class="side-btn side-btn-ghost side-btn-sm" onclick="clearAiTest()">清空</button>
          </div>
          <div id="aiTestResults" style="font-size:10.5px;color:var(--fg-2nd);max-height:200px;overflow-y:auto"></div>
        </div>
      </div>
      <div style="flex:1">
        <div>
          <button class="adv-toggle" id="advToggle" onclick="toggleAdvSection()">
            ⚙️ 高级设置 <span class="arrow">▶</span>
          </button>
          <div class="adv-section" id="advSection">
            <div class="adv-group-title">浏览器</div>
            <div class="adv-field-row"><label>浏览器</label>
              <select class="side-form-input" id="advBrowserType" onchange="onAdvChange()" style="flex:1;padding:4px 6px;border-radius:4px;border:1px solid var(--bd-2);background:var(--side-input-bg);color:var(--fg-2nd);font-size:12px">
                <option value="chrome">Google Chrome</option>
                <option value="edge">Microsoft Edge</option>
              </select>
            </div>
            <div class="adv-field-row"><label>无头</label><span id="advHeadless" class="toggle-switch" onclick="toggleAdvBool('headless')"></span></div>
            <div class="adv-field-row"><label>宽度</label><input class="side-form-input" id="advViewportW" type="number" placeholder="1280" onchange="onAdvChange()"></div>
            <div class="adv-field-row"><label>高度</label><input class="side-form-input" id="advViewportH" type="number" placeholder="800" onchange="onAdvChange()"></div>
            <div class="adv-field-row"><label>超时(s)</label><input class="side-form-input" id="advTimeout" type="number" placeholder="30" onchange="onAdvChange()"></div>
            <div class="adv-field-row"><label>UA</label><input class="side-form-input" id="advUserAgent" type="text" placeholder="留空自动" onchange="onAdvChange()"></div>
            <div class="adv-field-row"><label>代理</label><input class="side-form-input" id="advProxy" type="text" placeholder="http://..." onchange="onAdvChange()"></div>
            <div class="adv-group-title">频率限制</div>
            <div class="adv-field-row"><label>启用</label><span id="advRateLimit" class="toggle-switch" onclick="toggleAdvBool('rate_limit_enabled')"></span></div>
            <div class="adv-field-row"><label>每小时最多</label><input class="side-form-input" id="advRatePerHour" type="number" placeholder="30" onchange="onAdvChange()"></div>
            <div class="adv-field-row"><label>每天最多</label><input class="side-form-input" id="advRatePerDay" type="number" placeholder="100" onchange="onAdvChange()"></div>
            <div class="adv-group-title">登录</div>
            <div class="adv-field-row"><label>等待超时(s)</label><input class="side-form-input" id="advLoginWait" type="number" placeholder="300" onchange="onAdvChange()"></div>
            <div class="adv-field-row"><label>失败时清除Cookie</label><span id="advClearCookies" class="toggle-switch" onclick="toggleAdvBool('clear_cookies')"></span></div>
            <div class="adv-group-title">重试</div>
            <div class="adv-field-row"><label>最大次数</label><input class="side-form-input" id="advRetryAttempts" type="number" placeholder="3" onchange="onAdvChange()"></div>
            <div class="adv-field-row"><label>基础延迟(s)</label><input class="side-form-input" id="advRetryDelay" type="number" placeholder="2" step="0.1" onchange="onAdvChange()"></div>
            <div class="adv-field-row"><label>退避因子</label><input class="side-form-input" id="advRetryBackoff" type="number" placeholder="2" step="0.1" onchange="onAdvChange()"></div>
            <div class="adv-group-title">消息间隔(秒)</div>
            <div class="adv-field-row"><label>最小间隔</label><input class="side-form-input" id="advMsgIntervalMin" type="number" value="3" min="1" max="60" step="1" onchange="onAdvChange()"></div>
            <div class="adv-field-row"><label>最大间隔</label><input class="side-form-input" id="advMsgIntervalMax" type="number" value="8" min="1" max="120" step="1" onchange="onAdvChange()"></div>
          </div>
        </div>

      </div>
    </div>
    <div class="side-footer">
      <div class="status-dot idle" id="sbarDot"></div>
      <span class="status-text" id="sbarStatus">就绪</span>
      <span class="status-label" id="currentTaskLabel"></span>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span class="highlight">AI</span> 自动投递</div>
      <div class="topbar-task" id="topbarTask"></div>
      <div class="topbar-right">
        <span class="topbar-badge">v2.0</span>
        <button class="theme-toggle" onclick="toggleTheme()" title="切换主题" aria-label="切换主题">
          <span class="toggle-icon" id="themeIcon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
          <span id="themeLabel">🌙 暗色</span>
        </button>
      </div>
    </div>
    <div class="content">
      <!-- 4列统计卡片：总任务 | 已投递 | 已跳过 | 操作 -->
      <div class="stats-grid">
        <div class="stat-card accent"><div class="stat-label">总任务</div><div class="stat-value" id="statTotal">0</div><div class="stat-sub">全部任务</div></div>
        <div class="stat-card success"><div class="stat-label">已投递</div><div class="stat-value" id="statApplied">0</div><div class="stat-sub">成功投递</div></div>
        <div class="stat-card warning"><div class="stat-label">已跳过</div><div class="stat-value" id="statSkipped">0</div><div class="stat-sub">已过滤</div></div>
        <div class="stat-card info"><div class="stat-label">操作</div>
          <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
            <button class="btn btn-success btn-sm" id="btnStartAll" onclick="startAll()">▶ 启动</button>
            <button class="btn btn-danger btn-sm" id="btnStopAll" onclick="stopAll()" style="display:none">■ 停止</button>
            <button class="btn btn-ghost btn-sm" id="btnConfirmLogin" onclick="confirmLogin()" style="display:none">✓ 确认登录</button>
            <button class="btn btn-ghost btn-sm" onclick="saveConfig()">💾 保存配置</button>
            <button class="btn btn-ghost btn-sm" onclick="showExcelModal()">📊 Excel 导出</button>
            <button class="btn btn-warn btn-sm" id="btnPauseGreet" onclick="pauseGreet()" style="display:none">⏸ 暂停打招呼</button>
            <button class="btn btn-success btn-sm" id="btnResumeGreet" onclick="resumeGreet()" style="display:none">▶ 恢复打招呼</button>
            <button class="btn btn-warn btn-sm" id="btnPauseReply" onclick="pauseReply()" style="display:none">⏸ 暂停回复</button>
            <button class="btn btn-success btn-sm" id="btnResumeReply" onclick="resumeReply()" style="display:none">▶ 恢复回复</button>
            <button class="btn btn-ghost btn-sm" onclick="downloadReplyRecords()">📥 下载回复记录</button>
            <button class="btn btn-ghost btn-sm" onclick="downloadGreetRecords()">📥 下载打招呼记录</button>
          </div>
        </div>
      </div>
      <!-- 双面板行：岗位管理 + 运行日志 -->
      <div class="panel-row">
        <div class="panel panel-half">
          <div class="panel-header"><span class="panel-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span><span class="panel-title">岗位管理</span><div class="panel-actions"><button class="btn btn-ghost btn-sm" onclick="addJob()">+ 添加</button></div></div>
          <div class="panel-body" id="jobList"></div>
        </div>

// ── AI 配置渲染 ──
function renderAiConfig() {
  if (!config.ai) config.ai = {};

  setEl('aiEnabled', 'toggle-switch' + (config.ai.enabled ? ' on' : ''));
  setVal('aiThreshold', config.ai.match_threshold ?? 70);
  const badge = document.getElementById('aiBadge');
  if (badge) badge.textContent = config.ai.enabled ? '开' : '关';
  var container = document.getElementById('aiProviders');
  if (!container) return;
  var html = '';
  var providers = config.ai.providers || [];
  for (var i = 0; i < providers.length; i++) {
    var p = providers[i];
    html += '<div style="border:1px solid var(--bd-2);border-radius:8px;padding:8px;margin-bottom:6px;position:relative">';
    html += '<div style="position:absolute;right:4px;top:4px"><button class="side-btn side-btn-ghost side-btn-sm" onclick="removeAiProvider('+i+')" style="padding:2px 6px;font-size:10px">删除</button></div>';
    html += '<div class="acc-field-row"><label>名称</label><input class="side-form-input" value="'+escAttr(p.name||'')+'" onchange="updateAiProvider('+i+',\'name\',this.value)" placeholder="如: Agnes"></div>';
    html += '<div class="acc-field-row"><label>API Key</label><input class="side-form-input" type="password" value="'+escAttr(p.api_key||'')+'" onchange="updateAiProvider('+i+',\'api_key\',this.value)" placeholder="sk-..."></div>';
    html += '<div class="acc-field-row"><label>API 地址</label><input class="side-form-input" value="'+escAttr(p.api_base||'')+'" onchange="updateAiProvider('+i+',\'api_base\',this.value)" placeholder="https://..."></div>';
    html += '<div class="acc-field-row"><label>模型</label><input class="side-form-input" value="'+escAttr(p.model||'')+'" onchange="updateAiProvider('+i+',\'model\',this.value)" placeholder="agnes-2.5-flash"></div>';
    html += '<div class="acc-field-row"><label>超时(s)</label><input class="side-form-input" type="number" value="'+(p.timeout||30)+'" onchange="updateAiProvider('+i+',\'timeout\',parseInt(this.value)||30)"></div>';
    html += '</div>';
  }
  container.innerHTML = html;
  var summary = document.getElementById('aiProvSummary');
  if (summary) {
    if (providers.length === 0) {
      summary.textContent = '未配置';
    } else if (providers.length === 1) {
      summary.textContent = providers[0].name || '默认';
    } else {
      summary.textContent = providers.length + ' 个接口';
    }
  }
}

function addAiProvider() {
  if (!config.ai) config.ai = {};
  if (!config.ai.providers) config.ai.providers = [];
  config.ai.providers.push({name:'新接口',api_key:'',api_base:'',model:'',timeout:30});
  renderAiConfig();
  saveConfig();
}

function removeAiProvider(idx) {
  if (!config.ai || !config.ai.providers) return;
  config.ai.providers.splice(idx, 1);
  renderAiConfig();
  saveConfig();
}

function updateAiProvider(idx, field, val) {
  if (!config.ai || !config.ai.providers) return;
  config.ai.providers[idx][field] = val;
}

function toggleAiEnabled() {
  if (!config.ai) config.ai = {};
  config.ai.enabled = !config.ai.enabled;
  renderAiConfig();
  saveConfig();
  addLog('INFO', 'AI 智能解析已' + (config.ai.enabled ? '开启' : '关闭'));
}

function onAiChange() {
  if (!config.ai) config.ai = {};
  config.ai.enabled = document.getElementById('aiEnabled').classList.contains('on');
  config.ai.match_threshold = parseInt(document.getElementById('aiThreshold').value) || 70;
  var providers = config.ai.providers || [];
  if (providers.length > 0) {
    config.ai.api_key = providers[0].api_key || '';
    config.ai.api_base = providers[0].api_base || '';
    config.ai.model = providers[0].model || '';
  }
  renderAiConfig();
  saveConfig();
}

function testAi() {
  const status = document.getElementById('aiStatus');
  if (!config.ai) { if (status) status.textContent = '请先配置 AI'; return; }
  var providers = config.ai.providers || [];
  var hasKey = providers.some(function(p){ return p.api_key; });
  if (!hasKey) {
    if (status) status.textContent = '请先填写至少一个 API Key 并保存';
    addLog('ERROR', 'AI 测试失败: API Key 未配置');
    return;
  }
  if (status) status.textContent = '⏳ 正在测试 AI 连接...';
  saveConfig().then(function() {
    return fetch('/api/ai/test', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({provider_index: 0})});
  }).then(r=>r.json()).then(function(data) {
    if (data.status === 'ok') {
      if (status) status.textContent = '✓ ' + data.message;
      addLog('SUCCESS', 'AI 测试成功: ' + data.message + ' —— ' + (data.reply || ''));
    } else {
      throw new Error(data.message || 'AI 测试失败');
    }
  }).catch(function(e) {
    if (status) status.textContent = '✗ 测试失败: ' + e.message;
    addLog('ERROR', 'AI 测试失败: ' + e.message);
  });
}

// ── AI 测试对比 ──
let aiTestHistory = [];

function runAiTest() {
  const desc = document.getElementById('aiTestJobDesc').value.trim();
  if (!desc) { addLog('ERROR', '请先输入岗位描述'); return; }
  const resultsEl = document.getElementById('aiTestResults');
  resultsEl.innerHTML = '<div style="color:var(--fg-3rd)">⏳ 分析中...</div>';
  const startTime = Date.now();
  fetch('/api/ai/analyze', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({job_desc: desc, provider_index: 0})})
  .then(r=>r.json())
  .then(data => {
    const duration = ((Date.now() - startTime) / 1000).toFixed(1);
    if (data.status !== 'ok') throw new Error(data.message || 'AI 分析失败');
    const analysis = data.analysis || '';
    const provider = data.provider || '';
    const result = {time: new Date().toLocaleTimeString(), analysis: analysis, provider: provider, duration: duration};
    aiTestHistory.unshift(result);
    if (aiTestHistory.length > 5) aiTestHistory.pop();
    renderAiTestResults();
  })
  .catch(e => {
    resultsEl.innerHTML = '<div style="color:var(--danger)">✗ ' + e.message + '</div>';
    addLog('ERROR', 'AI 测试失败: ' + e.message);
  });
}

function renderAiTestResults() {
  const el = document.getElementById('aiTestResults');
  if (!el) return;
  if (aiTestHistory.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = aiTestHistory.map((r, i) =>
    '<div style="padding:6px 0;border-bottom:' + (i < aiTestHistory.length-1 ? '1px solid var(--bd-2)' : 'none') + '">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<span style="font-weight:600;color:var(--accent)">' + escHtml(r.provider || 'AI') + '</span>'+
        '<span style="color:var(--fg-4th);font-size:9px">' + r.time + ' · ' + r.duration + 's</span>'+
      '</div>'+
      '<div style="color:var(--fg-3rd);margin-top:2px;white-space:pre-wrap">'+escHtml(r.analysis || '')+'</div>'+
    '</div>'
  ).join('');
}

function clearAiTest() {
  aiTestHistory = [];
  document.getElementById('aiTestJobDesc').value = '';
  const el = document.getElementById('aiTestResults');
  if (el) el.innerHTML = '';
}

function loadTheme() {
  let saved = localStorage.getItem('boss-theme');
  if (!saved) {
    saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeUI(saved);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('boss-theme')) {
      const next = e.matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      updateThemeUI(next);

  });
}

function clearLog() {
  document.getElementById('logArea').innerHTML = '<div class="log-empty"><div class="empty-icon">📝</div><div>等待操作...</div></div>';
}

function copyLog() {
  var area = document.getElementById('logArea');
  if (!area) return;
  var text = area.innerText || area.textContent || '';
  if (!text.trim()) { addLog('WARN', '日志为空，5无可复制内容'); return; }
  if (Aavigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      addLog('SUCCESS', '✓ 日志已复制到剪贴板（' + text.length + ' 字符）');
    }).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    addLog('SUCCESS', '✓ 日志已复制到剪贴板');
  } catch(e) {
   DaddLog('ERROR', '复制失败: ' + e.message);
  }
  document.body.removeChild(ta);
}

      '<div class="modal-field"><label>城市</label><input id="modalCity" value="'+escHtml(job.city||'')+'" placeholder="例如: 长沙" list="cityList"><datalist id="cityList"></datalist></div>'+
      '<div class="modal-field"><label>搜索关键词</label><input id="modalQuery" value="'+escHtml(job.query||'')+'" placeholder="例如: 数据分析"></div>'+
      '<div class="modal-field"><label>翻页数</label><input id="modalPages" type="number" value="'+(job.scroll_pages||5)+'" min="1" max="20"></div>'+
      '<div class="modal-field"><label>打招呼消息</label><textarea id="modalGreeting" placeholder="输入自定义打招呼消息" style="min-height:80px">'+escHtml(job.greeting_message||defaultGreeting)+'</textarea></div>'+
      '<div class="modal-field"><label>作品图片</label>'+
        '<div class="side-btn-row" style="flex-wrap:wrap;margin-bottom:6px">'+
          '<button class="side-btn side-btn-ghost side-btn-sm" onclick="document.getElementById(\'jobImageInput\').click()">上传图片</button>'+
          '<input type="file" id="jobImageInput" class="hidden" accept="image/*" multiple onchange="handleJobImageUpload(event)">'+
        '</div>'+
        '<div id="jobImageChips" class="chip-list"></div>'+
      '</div>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-primary" onclick="saveJobModal()">'+(editingJobIdx>=0?'保存':'添加')+'</button>'+
        '<button class="btn btn-cancel" onclick="closeJobModal()">取消</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  if (typeof renderJobImageChips === 'function') renderJobImageChips();
  loadCityList();
}

function closeJobModal() {
  const m = document.getElementById('jobModal');
  if (5(m) m.remove();
}

function loadCityList() {
  var dl = document.getElementById('cityList');
  if (!dl) return;
  dl.innerHTML = cityList.map(function(c){return '<option value="'+escHtml(c)+'">'}).join('');
}

function handleJobImageUpload(event) {
  const files = event.target.files;
  if (!files || !files.length) return;
  const formData = new FormData();
  for (let i = 0; i < files.length; i++) {
    formData.append('files', files[i]);
  }
  fetch('/api/upload/images', { method:'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.status === 'ok' && data.files) {
        const a = config.accounts[activeAccountIdx];
        if (a && a.jobs && a.jobs[editingJobIdx]) {
          if (!a.jobs[editingJobIdx].image_files) a.jobs[editingJobIdx].image_files = [];
          a.jobs[editingJobIdx].image_files.push(...data.files);
          renderJobImageChips();
        }
      }
    })
    .catch(() => {});
  event.target.value = '';
}

function renderJobImageChips() {
  const el = document.getElementById('jobImageChips');
  if (!el) return;
  const a = config.accounts[activeAccountIdx];
  const job = a && a.jobs && a.jobs[editingJobIdx];
  el.innerHTML = '';
  if (!job || !job.image_files || !job.image_files.length) return;
  job.image_files.forEach(f => {
    var fn = f.replace(/^dashboard[\/]/, '');
    var chip = document.createElement('div');
    chip.className = 'job-img-chip';
    chip.onclick = function() { showImageLightbox('/dashboard/' + fn); };
    var img = document.createElement('img');
    img.src = '/dashboard/' + fn;
    chip.appendChild(img);
    var rm = document.createElement('span');
    rm.className = 'chip-remove';
    rm.textContent = '✕';
    rm.onclick = function(e) { e.stopPropagation(); removeImageChipForJob(f); };
    chip.appendChild(rm);
    el.appendChild(chip);
  });
}

function removeImageChipForJob(name) {
  name = decodeURIComponent(name);
  const a = config.accounts[activeAccountIdx];
  if (!a || !a.jobs || !a.jobs[editingJobIdx] || !a.jobs[editingJobIdx].image_files) return;
  const i = a.jobs[editingJobIdx].image_files.indexOf(name);
  if (i >= 0) {
    a.jobs[editingJobIdx].image_files.splice(i, 1);
    renderJobImageChips();
    saveConfig();
  }
}

function showImageLightbox(src) {
  closeLightbox();
  var overlay = document.createElement('div');
  overlay.id = 'lightboxOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fadeIn .2s ease';
  overlay.onclick = closeLightbox;
  var img = document.createElement('img');
 6img.src = src;
  img.style.cssText = 'max-width:90vw;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:slideUp .25s ease';
  img.onclick = function(e) { e.stopPropagation(); };
  overlay.appendChild(img);
  document.body.appendChild(overlay);
}

function closeLightbox() {
  var el = document.getElementById('lightboxOverlay');
  if (el) el.remove();
}

function saveJobModal() {
  const city = document.getElementById('modalCity').value.trim();
  const query = document.getElementById('modalQuery').value.trim();
  const pages = parseInt(document.getElementById('modalPages').value) || 5;
  const greeting = document.getElementById('modalGreeting').value.trim() || defaultGreeting;
  if (!city || !query) { addLog('ERROR','城市和关键词不能为空'); return; }
  const a = config.accounts[activeAccountIdx];
  if (!a) return;
  if (!a.jobs) a.jobs = [];
  const job = { enabled:true, city, query, scroll_pages:pages, greeting_message:greeting };
  if (editingJobIdx >= 0 && editingJobIdx < a.jobs.length) {
    const old = a.jobs[editingJobIdx];
    job.image_files = old.image_files || [];
    a.jobs[editingJobIdx] = job;
    addLog('INFO', '岗位已更新: ' + query);
  } else {
    job.image_files = [];
    a.jobs.push(job);
    addLog('INFO', '岗位已添加: ' + query);
  }
  closeJobModal();
  renderJobs();
  updateSbarJobs();
  saveConfig();
}

function deleteJob(i) {
  if (!confirm('确定删除此岗位？')) return;
  const a = config.accounts[activeAccountIdx];
  if (!a || !a.jobs) return;
  a.jobs.splice(i, 1);
  renderJobs();
  updateSbarJobs();
  saveConfig();
  addLog('INFO', '岗位已删除');
}

// ── 账号添加/删除 ──
function addAccount() {
  const name = '账号' + (config.accounts.length + 1);
  const cookieFile = document.getElementById('accCookie').value || 'zhipin_cookies.json';
  fetch('/api/accounts/add', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name: name, cookie_file: cookieFile, enabled: true}) })
    .then(r=>r.json())
    .then(data => {
      if (data.status === 'ok') {
        loadConfig();
        activeAccountIdx = config.accounts.length - 1;
        addLog('INFO', '已添加新账号: ' + name);
      } else { addLog('ERROR', '添加账号失败: ' + (data.message||'')); }
    })
    .catch(e => addLog('ERROR', '添加账号异常: ' + e.message));
}

function deleteAccount() {
  if (config.accounts.length <= 1) { addLog('WARN', '至少需要保留一个账号'); return; }
  if (!confirm('确定删除账号「' + (config.accounts[activeAccountIdx]?.name || '账号'+(activeAccountIdx+1)) + '」？')) return;
  fetch('/api/accounts/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({index: activeAccountIdx}) })
    .then(r=>r.json())
    .then(data => {
      if (data.status === 'ok') {
        loadConfig();
        if (activeAccountIdx >= config.accounts.length) activeAccountIdx = Math.max(0, config.accounts.length - 1);
        addLog('INFO', '已删除账号');
      } else { addLog('ERROR', '删除账号失败: ' + (data.message||'')); }
    })
    .catch(e => addLog('ERROR', e.message));
}

// ── 启动/停止 ──
function startAll() {
  const btn = document.getElementById('btnStartAll');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 启动中...'; }
  saveConfig()
    .then(() => {
      return fetch('/api/start', { method:'POST' });
    })
    .then(r => r.json())
    .then(data => {
      if (data.status === 'ok') {
        addLog('SYSTEM', '机器人已启动');
        setControls(true);
      } else {
        throw new Error(data.message || '启动失败');
      }
    })
    .catch(e => {
      addLog('ERROR', '启动失败: ' + e.message);
      if (btn) { btn.disabled = false; btn.textContent = '▶ 启动'; btn.style.display = ''; }
    });
}

function stopAll() {
  fetch('/api/stop', { method:'POST' })
    .then(r => r.json())
    .then(data => {
      addLog('SYSTEM', '机器人已停止');
      setControls(false);
    })
    .catch(e => addLog('ERROR', '停止失败: ' + e.message));
  const btn = document.getElementById('btnStartAll');
  if (btn) { btn.disabled = false; btn.textContent = '▶ 启动'; btn.style.display = ''; }
  const stopBtn = document.getElementById('btnStopAll');
  if (stopBtn) { stopBtn.style.display = 'none'; }
  const dot = document.getElementById('sbarDot');
  if (dot) dot.className = 'status-dot idle';
  const st = document.getElementById('sbarStatus');
  if (st) st.textContent = '就绪';
}

function confirmLogin() {
  fetch('/api/confirm_login', { method:'POST' })
    .then(r => r.json())
    .then(data => {
      addLog('SYSTEM', '已确认登录');
      const btn = document.getElementById('btnConfirmLogin');
      if (btn) btn.style.display = 'none';
    })
    .catch(e => addLog('ERROR', '确认登录失败: ' + e.message));
}

function doConfirmLogin() {
  const modal = document.getElementById('loginModal');
  if (modal) {
    modal.style.display = 'none';
    modal.classList.remove('active');
  }
  fetch('/api/confirm_login', { method:'POST' })
    .then(r => r.json())
    .then(data => {
      addLog('SYSTEM', '已确认登录，继续执行...');
    })
    .catch(e => addLog('ERROR', '确认登录失败: ' + e.message));
}

// ── 暂停/恢复打招呼 ──
function pauseGreet() {
  fetch('/api/pause_greet', { method:'POST' })
    .then(r => r.json())
    .then(data => {
      if (data.status === 'ok') {
        greetPaused = true;
        updatePauseButtons();
        addLog('SYSTEM', '打招呼已暂停');
      }
    })
    .catch(e => addLog('ERROR', '暂停打招呼失败: ' + e.message));
}

function resumeGreet() {
  fetch('/api/resume_greet', { method:'POST' })
    .then(r => r.json())
    .then(data => {
      if (data.status === 'ok') {
        greetPaused = false;
        updatePauseButtons();
        addLog('SYSTEM', '打招呼已恢复');
      }
    })
    .catch(e => addLog('ERROR', '恢复打招呼失败: ' + e.message));
}

// ── 暂停/恢复回复 ──
function pauseReply() {
  fetch('/api/pause_reply', { method:'POST' })
    .then(r => r.json())
    .then(data => {
      if (7(data.status === 'ok') {
        replyPaused = true;
        updatePauseButtons();
        addLog('SYSTEM', '回复已暂停（人工接管模式）');
      }
    })
    .catch(e => addLog('ERROR', '暂停回复失败: ' + e.message));
}

function resumeReply() {
  fetch('/api/resume_reply', { method:'POST' })
    .then(r => r.json())
    .then(data => {
      if (data.status === 'ok') {
        replyPaused = false;
        updatePauseButtons();
        addLog('SYSTEM', '回复已恢复');
      }
    })
    .catch(e => addLog('ERROR', '恢复回复失败: ' + e.message));
}

function updatePauseButtons() {
  const pg = document.getElementById('btnPauseGreet');
  const rg = document.getElementById('btnResumeGreet');
  const pr = document.getElementById('btnPauseReply');
  const rr = document.getElementById('btnResumeReply');
  if (pg) pg.style.display = greetPaused ? 'none' : '';
  if (rg) rg.style.display = greetPaused ? '' : 'none';
  if (pr) pr.style.display = replyPaused ? 'none' : '';
  if (rr) rr.style.display = replyPaused ? '' : 'none';
}

// ── 下载回复/打招呼记录 ──
function downloadReplyRecords() {
  window.open('/api/export/reply_records?format=json', '_blank');
  addLog('INFO', '正在下载回复记录...');
}

function downloadGreetRecords() {
  window.open('/api/export/greet_records?format=json', '_blank');
  addLog('INFO', '正在下载打招呼记录...');
}

// ── 控制按钮状态 ──
function setControls(running) {
  const s=document.getElementById('btnStartAll'),p=document.getElementById('btnStopAll'),cl=document.getElementById('btnConfirmLogin'),dot=document.getElementById('sbarDot'),st=document.getElementById('sbarStatus');
  if(s) { s.style.display=running?'none':''; s.disabled=false; s.textContent='▶ 启动'; }
  if(p) { p.style.display=running?'':'none'; }
  if(cl) { cl.style.display=running?'':'none'; }
  if(dot) dot.className='status-dot'+(running?' running':' idle');
  if(st) st.textContent=running?'运行中':'就绪';
  if (running) {
    updatePauseButtons();
  } else {
    const pg=document.getElementById('btnPauseGreet'),rg=document.getElementById('btnResumeGreet'),pr=document.getElementById('btnPauseReply'),rr=document.getElementById('btnResumeReply');
    if(pg) pg.style.display='none';
    if(rg) rg.style.display='none';
    if(pr) pr.style.display='none';
    if(rr) rr.style.display='none';
  }
}

function updateStats() {
  const t=document.getElementById('statTotal'),a=document.getElementById('statApplied'),s=document.getElementById('statSkipped');
  if(t) t.textContent=stats.total;
  if(a) a.textContent=stats.applied;
  if(s) s.textContent=stats.skipped;
}

function escHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function escAttr(t){return (t||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function addLog(level,message){
  const area=document.getElementById('logArea');
  const empty=area.querySelector('.log-empty');
  if(empty) empty.remove();
  const div=document.createElement('div');div.className='log-entry';
  const ts=new Date().toLocaleTimeString();
  div.innerHTML='<span class="log-time">'+ts+'</span><span class="log-message log-'+level+'">'+escHtml(message)+'</span>';
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
  while(area.children.length>300) area.removeChild(area.firstChild);
}

// ── SocketIO 事件 ──
socket.on('connect',()=>{
  addLog('SYSTEM','WebSocket 已连接');
  document.getElementById('connStatus').textContent='已连接';
  document.getElementById('connStatus').classList.remove('disconnected');
});
socket.on('disconnect',()=>{
  addLog('ERROR','WebSocket 断开');
  document.getElementById('connStatus').textContent='已断开';
  document.getElementById('connStatus').classList.add('disconnected');
});
socket.on('bot_log',(data)=>{
  if(data&&data.message){
    var level = data.level || 'INFO';
    if(level === 'DEBUG') return;
    addLog(level, data.message);
  }
});
socket.on('bot_progress',(data)=>{
  if(data.total!==undefined) stats.total=data.total;
  if(data.applied!==undefined) stats.applied=data.applied;
  if(data.skipped!==undefined) stats.skipped=data.skipped;
  if(data.reply_sent!==undefined) stats.reply_sent=data.reply_sent;
  if(data.reply_skipped!==undefined) stats.reply_skipped=data.reply_skipped;
  if(data.resume_sent!==undefined) stats.resume_sent=data.resume_sent;
  if(data.important_events!==undefined) stats.important_events=data.important_events;
  updateStats();
  if (data.account_index !== undefined) {
    if (!accountStatuses[data.account_index]) accountStatuses[data.account_index] = {};
    accountStatuses[data.account_index].running = true;
    renderAccounts();
  }
});
socket.on('status_update',(data)=>{
  if (data.running !== undefined) {
    setControls(data.running);
  }
  if (data.accounts && Array.isArray(data.accounts)) {
    accountStatuses = data.accounts.map(function(acc) {
      return {
        running: acc.running || false,
        needs_login: acc.needs_login || false,
        name: acc.name || ''
      };
    });
    renderAccounts();
  }
  if (!data.running) {
    document.getElementById('currentTaskLabel').textContent='';
  }
});
socket.on('login_required',(data)=>{
  const modal = document.getElementById('loginModal');
  if (!modal) return;
  const desc = document.getElementById('loginModalDesc');
  if (data && data.message) {
    desc.textContent = data.message;
  } else {
    desc.textContent = '登录已过期或未登录，请在浏览器中完成登录，然后点击下方按钮继续。';
  }
  modal.style.display = 'flex';
  modal.classList.add('active');
  addLog('WARN', '需要登录：请在浏览器中登录后点击确认');
  const cl = document.getElementById('btnConfirmLogin');
  if (cl) cl.style.display = '';
});

loadTheme();
loadConfig();

function closeLoginModal() {
  const modal = document.getElementById("loginModal");
  if (modal) {
    modal.style.display = "none";
    modal.classList.remove("active");
  }
}

function uploadCookieFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  fetch('/api/upload/cookie', { method:'POST', body: formData })
    .then(r=>r.json())
    .then(data => {
      if (data.status === 'ok') {
        addLog('SUCCESS', 'Cookie 已上传: ' + file.name);
        config.accounts[activeAccountIdx].cookie_file = data.filename || file.name;
        renderAccountConfig();
        saveConfig();
      } else {
        addLog('ERROR', 'Cookie 上传失败: ' + (data.message || ''));
      }
    })
    .catch(e => addLog('ERROR', 'Cookie 上传失败: ' + e.message));
  event.target.value = '';
}

  });

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      if (m.target.classList && m.target.classList.contains('stat-value')) {
        var val = parseInt(m.target.textContent);
        if (!isNaN(val) && val > 0) {
          anime({
            targets: m.target,
            scale: [1.2, 1],
            duration: 400,
            easing: 'easeOutBack'
          });
        }
      }
    });
  });
  document.querySelectorAll('.stat-value').forEach(function(el) {
    observer.observe(el, {childList: true, characterData: true, subtree: true});
  });
});
